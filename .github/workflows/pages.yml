# Publish site/ to GitHub Pages.
#
# Pages can only serve the repo root or /docs from a branch, and the site
# lives in site/, so it is deployed by Actions instead.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# The page is built locally (tools/demo/build_site.py needs the demo repo and
# pblame), so this workflow only uploads what is committed.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish placeholders
        run: |
          if grep -n "__REPO__\|YOUR-NAME" site/index.html; then
            echo "site/index.html still has a placeholder repo URL; rebuild with --repo" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
